<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerosols · Earth Information Jukebox</title>
<meta name="description" content="A journey through Earth's aerosol hotspots, played by a sombre orchestra. NASA GEOS model data.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/src/shared/theme.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header id="ej-shell"></header>

<main id="main" class="room">
  <div class="sr-only"><p id="exKicker"></p><p id="exTitle"></p><p id="exLede"></p></div>

  <figure class="piece" style="--ar:1.272">
    <canvas id="cv" tabindex="0" role="img"></canvas>
    <div class="subtitle" aria-live="polite"><span class="where" id="capWhere"></span><span id="capTxt"></span></div>
    <div id="startOverlay" class="startover"><button class="big" id="startBtn"></button><p id="startHint"></p></div>
  </figure>

  <div class="plinth">
    <div id="ej-label"></div>
    <div class="transport" role="group" aria-label="Playback">
      <div class="tabs" role="radiogroup" aria-label="Mode">
        <button role="radio" aria-checked="true" data-mode="story"></button>
        <button role="radio" aria-checked="false" data-mode="lens"></button>
        <button role="radio" aria-checked="false" data-mode="scan"></button>
      </div>
      <span id="storyNav" class="group">
        <button id="prevStop" aria-label="Previous stop" aria-keyshortcuts=",">‹</button>
        <button id="nextStop" aria-label="Next stop" aria-keyshortcuts=".">›</button>
      </span>
      <button class="primary" id="playBtn" aria-pressed="false">Play</button>
      <button id="describeBtn" aria-keyshortcuts="D">Describe</button>
    </div>
  </div>

  <aside id="ej-drawer" aria-label="Controls">
    <p class="help" id="modeHelp"></p>
    <div class="panel">
      <h2>Orchestra</h2>
      <div class="mixer" id="mixer"></div>
    </div>
    <div class="panel sound">
      <h2>Sound</h2>
      <div class="ctrl wide"><label for="fid">Data ↔ Music</label><input type="range" id="fid" min="0" max="100" aria-describedby="fidHelp"><output id="fidO"></output></div>
      <p id="fidHelp" class="help">Left: the melody model shapes the phrases. Right: notes follow the data exactly.</p>
      <div class="ctrl"><label for="scale">Scale</label><select id="scale"></select><span></span></div>
      <div class="ctrl"><label for="bpm">Tempo</label><input type="range" id="bpm" min="40" max="140"><output id="bpmO"></output></div>
      <div class="ctrl"><label for="thr">Sensitivity</label><input type="range" id="thr" min="0" max="100"><output id="thrO"></output></div>
      <div class="ctrl"><label for="lensR">Lens size</label><input type="range" id="lensR" min="4" max="40"><output id="lensRO"></output></div>
      <div class="ctrl"><label for="rev">Reverb</label><input type="range" id="rev" min="0" max="100"><output id="revO"></output></div>
      <div class="ctrl"><label for="vol">Volume</label><input type="range" id="vol" min="0" max="100"><output id="volO"></output></div>
    </div>
    <div class="panel">
      <div class="modelinfo" id="modelInfo" hidden></div>
      <details class="how"><summary>How the sound is made</summary><ul id="howList"></ul></details>
      <p id="about" class="about"></p>
      <p class="keys"><kbd>←↑↓→</kbd> move lens · <kbd>+</kbd><kbd>−</kbd> lens size · <kbd>Space</kbd> play · <kbd>D</kbd> describe · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> modes · <kbd>,</kbd><kbd>.</kbd> stops · <kbd>T</kbd> transcript · <kbd>Esc</kbd> orbit</p>
    </div>
  </aside>

  <section id="ej-next" aria-label="Continue the journey"></section>
  <footer class="ej-foot" id="foot"></footer>
</main>

<script type="module" src="./main.js"></script>
</body>
</html>
