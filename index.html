<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Information Jukebox</title>
<meta name="description" content="An accessible gallery of sonifications built from NASA data about the air: aerosols, carbon dioxide, forest canopy and nitrogen dioxide, hung in low Earth orbit.">
<meta name="theme-color" content="#08090b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/src/shared/theme.css">
<link rel="stylesheet" href="/src/hub/hub.css">
</head>
<body class="intro">
<canvas id="sky" aria-hidden="true"></canvas>
<div id="veil" class="veil" aria-hidden="true"></div>

<header class="top">
  <div class="brand" id="brandName">Earth Information Jukebox</div>
  <div class="tools" role="group" aria-label="Gallery tools" id="tools">
    <button id="listBtn" class="ghost" aria-expanded="false" aria-controls="list" aria-keyshortcuts="L">Index</button>
  </div>
</header>

<main id="main">
  <h1 class="sr-only">Earth Information Jukebox: a gallery of sound in low Earth orbit</h1>

  <aside id="list" hidden aria-label="All works">
    <ol id="listItems"></ol>
    <p class="credits" id="listCredits"></p>
  </aside>

  <section class="placard" id="card" aria-label="The work in front of you" aria-live="off">
    <span class="no mono" id="cKick">01</span>
    <h2 id="cTitle">—</h2>
    <p id="cSub"></p>
    <button id="enterBtn" class="primary">Enter</button>
  </section>
  <button class="turn prev" id="prevBtn" aria-label="Turn to the previous work">‹</button>
  <button class="turn next" id="nextBtn" aria-label="Turn to the next work">›</button>
</main>

<div class="help" id="help" aria-hidden="true"></div>
<div id="tip" hidden></div>

<div id="splash" class="overlay" role="dialog" aria-modal="true" aria-labelledby="splashTitle">
  <div class="splash">
    <h1 id="splashTitle"></h1>
    <p id="spBody"></p>
    <div class="row">
      <button id="enterDome" class="primary"></button>
      <button id="enterList" class="ghost"></button>
    </div>
    <small id="spSmall"></small>
  </div>
</div>

<script type="module" src="/src/hub/main.js"></script>
</body>
</html>
